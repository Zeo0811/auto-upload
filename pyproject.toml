[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-upload"
version = "2.0.0"
description = "Automated video upload to social platforms (Xiaohongshu, WeChat Channels, Douyin) via Chrome Extension + Python API + MCP Server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
oss = ["oss2>=2.18.0"]
s3 = ["boto3>=1.34.0"]
sheets = ["gspread>=6.0.0", "google-auth>=2.29.0"]
all = ["oss2>=2.18.0", "boto3>=1.34.0", "gspread>=6.0.0", "google-auth>=2.29.0"]

[project.scripts]
auto-upload-server = "mcp_server:mcp.run"

[tool.setuptools.packages.find]
include = ["core*", "sources*", "platforms*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.js", "*.png", "*.md"]
